nameOverride: ""
fullnameOverride: ""
namespace: ""

# ---------------------------------------------------------------------------
# Image
# ---------------------------------------------------------------------------

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# ---------------------------------------------------------------------------
# TLS
# ---------------------------------------------------------------------------

tls:
  ops:
    disabled: true
  secretName: ""
  mountPath: ""

# ---------------------------------------------------------------------------
# Secret References
# ---------------------------------------------------------------------------

secretRefs:
  secretName: ""
  validateExisting: false
  keys:
    controllerGeneratedActivationToken: "worker-controller-generated-activation-token"

# ---------------------------------------------------------------------------
# Worker
# ---------------------------------------------------------------------------

worker:
  config: |
    disable_mlock = true

    # hcp_boundary_cluster_id = "your-cluster-id-here" # Optional: set when registering with HCP Boundary.

    listener "tcp" {
      address = "0.0.0.0:9202"
      purpose = "proxy"
    }

    listener "tcp" {
      address     = "0.0.0.0:9203"
      purpose     = "ops"
      tls_disable   = "{{ .Values.tls.ops.disabled }}"
      tls_cert_file = "{{ .Values.tls.mountPath }}/tls.crt"
      tls_key_file  = "{{ .Values.tls.mountPath }}/tls.key"
    }

    worker {
      name = "boundary-worker" # Optional: must be set for kms registration.
      initial_upstreams = [] # Optional: set when the controller is self-managed.
      public_addr = "" # Optional: Set the worker's public address to make it reachable by clients.
      auth_storage_path = "/var/lib/boundary" # Optional: set when using token based worker registration.
      recording_storage_path = "/boundary/recording" # Optional: set when using session recording.
      tags {
        type = ["worker", "egress"]
      }

      controller_generated_activation_token = "controller-led-activation-token-here" # Optional: set when using controller-led worker registration. Requires setting the token value via Kubernetes Secret and referencing it with worker.extraEnv or worker.secretRefs. If not set, the worker will attempt to register without a token, which only works if the Boundary Controller is configured to allow tokenless registration. See docs/OPERATIONS.md for the three ways to supply the token.
    }

    events {
      audit_enabled        = true
      sysevents_enabled    = true
      observations_enabled = true
      sink "stderr" {
        name = "all-events"
        description = "All events sent to stderr"
        event_types = ["*"]
        format = "hclog-text"
      }
    }
  
  livenessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5

  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5

  # Termination grace period: 2 hours (7200 seconds)
  # This long grace period allows active Boundary sessions to complete naturally before pod termination.
  # Adjust based on your maximum expected session duration. Sessions longer than this will be forcibly terminated.
  terminationGracePeriodSeconds: 7200

  service:
    proxy:
      type: LoadBalancer
      port: 9202
      targetPort: 9202
      annotations: {}
    ops:
      type: ClusterIP
      port: 9203
      targetPort: 9203
      annotations: {}

  resources:
    limits:
      cpu: 200m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 512Mi

  persistence:
    recording:
      enabled: false
      size: "10Gi"
      accessMode: ReadWriteOnce
      storageClass: "" # Uses cluster default StorageClass; set to e.g. "gp3" for AWS
      path: "/boundary/recording"
      retainOnUninstall: true # When true (default), the PVC is preserved after `helm uninstall`. Set to false to delete the PVC on uninstall.
    authStorage:
      enabled: false
      size: "1Gi"
      accessMode: ReadWriteOnce
      storageClass: "" # Uses cluster default StorageClass; set to e.g. "gp3" for AWS
      path: "/var/lib/boundary"
      retainOnUninstall: true # When true (default), the PVC is preserved after `helm uninstall`. Set to false to delete the PVC on uninstall.

# ---------------------------------------------------------------------------
# Security Context
# ---------------------------------------------------------------------------

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: "OnRootMismatch"
  seccompProfile:
    type: RuntimeDefault

# Container security context
containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# ---------------------------------------------------------------------------
# ServiceAccount
# ---------------------------------------------------------------------------
# The chart does not create a ServiceAccount
# Set to an existing ServiceAccount name when cloud identity or custom permissions are required.
serviceAccount:
  name: ""
  automountServiceAccountToken: false 

# ---------------------------------------------------------------------------
# Optional configurations
# ---------------------------------------------------------------------------
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
extraEnv: []

# ---------------------------------------------------------------------------
# OpenShift
# ---------------------------------------------------------------------------

openshift:
  enabled: false
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  route:
    proxy:
      enabled: true
      host: ""
      annotations: {}
    ops:
      enabled: true
      host: ""
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
        destinationCACertificate: ""
      annotations: {}
