worker:
  service:
    proxy:
      type: ClusterIP
      port: 9202
      targetPort: 9202
      annotations: {}
    ops:
      type: ClusterIP
      port: 9203
      targetPort: 9203
      annotations: {}

# ---------------------------------------------------------------------------
# OpenShift
# ---------------------------------------------------------------------------
openshift:
  enabled: true
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  route:
    proxy:
      enabled: false
      host: ""
      tls:
        # passthrough keeps TLS end-to-end to the worker; use edge only if you terminate TLS at the router.
        termination: passthrough
      annotations: {}
