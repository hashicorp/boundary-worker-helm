suite: Test Worker OpenShift Route Configuration
templates:
  - worker-route.yaml
tests:
  # ============================================================================
  # ROUTE NOT RENDERED ON VANILLA KUBERNETES
  # ============================================================================

  - it: should not render a Route when openshift.enabled is false
    set:
      openshift.enabled: false
      openshift.route.proxy.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should render no Routes when both routes are disabled
    set:
      openshift.enabled: true
      openshift.route.proxy.enabled: false
      openshift.route.ops.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render a Route when both flags are false
    set:
      openshift.enabled: false
      openshift.route.proxy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  # ============================================================================
  # ROUTE RENDERED ON OPENSHIFT
  # ============================================================================

  - it: should render proxy and ops Routes when OpenShift and both routes are enabled
    set:
      openshift.enabled: true
      openshift.route.proxy.enabled: true
      openshift.route.ops.enabled: true
    asserts:
      - hasDocuments:
          count: 2
      - isAPIVersion:
          of: route.openshift.io/v1
      - isKind:
          of: Route

  - it: should always use passthrough TLS termination
    set:
      openshift.enabled: true
      openshift.route.proxy.enabled: true
      openshift.route.ops.enabled: false
    asserts:
      - equal:
          path: spec.tls.termination
          value: passthrough

  - it: should configure the ops Route
    release:
      name: my-worker
    set:
      openshift.enabled: true
      openshift.route.proxy.enabled: false
      openshift.route.ops.enabled: true
      openshift.route.ops.host: ops.apps.cluster.example.com
      tls.ops.disabled: false
      openshift.route.ops.tls.termination: reencrypt
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: my-worker-ops-route
      - equal:
          path: spec.host
          value: ops.apps.cluster.example.com
      - equal:
          path: spec.to.name
          value: my-worker-ops
      - equal:
          path: spec.port.targetPort
          value: ops
      - equal:
          path: spec.tls.termination
          value: reencrypt
      - equal:
          path: spec.tls.insecureEdgeTerminationPolicy
          value: Redirect

  - it: should configure the ops Route destination CA for reencrypt
    set:
      openshift.enabled: true
      openshift.route.proxy.enabled: false
      openshift.route.ops.enabled: true
      openshift.route.ops.tls.destinationCACertificate: |
        -----BEGIN CERTIFICATE-----
        example
        -----END CERTIFICATE-----
      tls.ops.disabled: false
      openshift.route.ops.tls.termination: reencrypt
    asserts:
      - isNotNull:
          path: spec.tls.destinationCACertificate
      - matchRegex:
          path: spec.tls.destinationCACertificate
          pattern: "BEGIN CERTIFICATE"

  - it: should not set spec.host when host is empty
    set:
      openshift.enabled: true
      openshift.route.proxy.enabled: true
      openshift.route.proxy.host: ""
      openshift.route.ops.enabled: false
    asserts:
      - isNull:
          path: spec.host

  - it: should set spec.host when a custom host is provided
    set:
      openshift.enabled: true
      openshift.route.proxy.enabled: true
      openshift.route.proxy.host: "boundary.apps.cluster.example.com"
      openshift.route.ops.enabled: false
    asserts:
      - equal:
          path: spec.host
          value: "boundary.apps.cluster.example.com"

  - it: should target the proxy service
    release:
      name: my-worker
    set:
      openshift.enabled: true
      openshift.route.proxy.enabled: true
      openshift.route.ops.enabled: false
    asserts:
      - equal:
          path: spec.to.kind
          value: Service
      - equal:
          path: spec.to.name
          value: my-worker-proxy
      - equal:
          path: spec.port.targetPort
          value: proxy

  - it: should apply route annotations when provided
    set:
      openshift.enabled: true
      openshift.route.proxy.enabled: true
      openshift.route.proxy.annotations:
        haproxy.router.openshift.io/timeout: "2h"
      openshift.route.ops.enabled: false
    asserts:
      - equal:
          path: metadata.annotations["haproxy.router.openshift.io/timeout"]
          value: "2h"

  - it: should use the release namespace
    release:
      namespace: boundary-prod
    set:
      openshift.enabled: true
      openshift.route.proxy.enabled: true
      openshift.route.ops.enabled: false
    asserts:
      - equal:
          path: metadata.namespace
          value: boundary-prod

  - it: should carry standard labels
    set:
      openshift.enabled: true
      openshift.route.proxy.enabled: true
      openshift.route.ops.enabled: false
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: worker
      - isNotNull:
          path: metadata.labels["helm.sh/chart"]
      - isNotNull:
          path: metadata.labels["app.kubernetes.io/name"]

  - it: should use values.namespace over release namespace when set
    release:
      namespace: release-ns
    set:
      openshift.enabled: true
      openshift.route.proxy.enabled: true
      namespace: override-ns
      openshift.route.ops.enabled: false
    asserts:
      - equal:
          path: metadata.namespace
          value: override-ns
