# This MicroShift acceptance environment does not provision a TLS certificate
# for the ops listener, so it overrides the chart's secure-by-default TLS
# settings to match the plaintext worker.hcl generated by scripts/worker-template.hcl.
# Production installs should leave tls.ops.disabled at its chart default (false)
# and supply a real TLS Secret via tls.secretName.
tls:
  ops:
    disabled: true

worker:
  service:
    proxy:
      type: ClusterIP
      port: 9202
      targetPort: 9202
      annotations: {}
    ops:
      type: ClusterIP
      port: 9203
      targetPort: 9203
      annotations: {}

# ---------------------------------------------------------------------------
# OpenShift
# ---------------------------------------------------------------------------
openshift:
  enabled: true
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  route:
    proxy:
      enabled: false
      host: ""
      annotations: {}
    ops:
      enabled: true
      host: ""
      tls:
        # edge (not reencrypt) because the ops listener above serves plaintext HTTP in this test environment.
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
        destinationCACertificate: ""
      annotations: {}
